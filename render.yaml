# Render Blueprint: backend (serving the frontend too) + ML service.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: recalliq-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

  - type: web
    name: recalliq-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ML_SERVICE_URL
        fromService: { type: web, name: recalliq-ml, property: hostport }  # private network address
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # https://<your-api>.onrender.com/api/gmail/callback
      - key: FRONTEND_URL
        sync: false   # https://<your-api>.onrender.com  (same service)
      - key: CORS_ORIGINS
        sync: false   # https://<your-api>.onrender.com
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
